<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 3 - Controle de Produção</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Exercício 3 - Controle de Produção e Estoque</h1>

        <label for="codigoOrdem">Código da ordem:</label>
        <input type="text" id="codigoOrdem">
        <br><br>

        <label for="codigoProduto">Código do produto:</label>
        <input type="text" id="codigoProduto">
        <br><br>

        <label for="tipoProduto">Tipo de produto (1-Padrão, 2-Premium, 3-Sob encomenda):</label>
        <input type="number" id="tipoProduto">
        <br><br>

        <label for="quantidadeProduzida">Quantidade produzida:</label>
        <input type="number" id="quantidadeProduzida">
        <br><br>

        <label for="custoUnitario">Custo unitário de produção:</label>
        <input type="number" id="custoUnitario" step="0.01">
        <br><br>

        <label for="estoqueInicial">Estoque inicial do produto:</label>
        <input type="number" id="estoqueInicial">
        <br><br>

        <button id="calcular">Calcular</button>
        <p id="resultado"></p>

        <button id="gerarRelatorio">Gerar Relatório</button>
        <div id="relatorio"></div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/exercicio3.js"></script>
</body>
</html>
