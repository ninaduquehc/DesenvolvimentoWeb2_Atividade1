<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5 - Treinos Esportivos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Exercício 5 - Treinos e Risco de Lesão</h1>

        <label for="cargaMaxima">Carga máxima semanal recomendada:</label>
        <input type="number" id="cargaMaxima" step="0.01">
        <br><br>

        <hr>

        <label for="codigoTreino">Código do treino:</label>
        <input type="text" id="codigoTreino" autocomplete="off">
        <br><br>

        <label for="nomeJogador">Nome do jogador:</label>
        <input type="text" id="nomeJogador" autocomplete="off">
        <br><br>

        <label for="posicao">Posição (G-Goleiro, Z-Zagueiro, M-Meio-campo, A-Atacante):</label>
        <input type="text" id="posicao" maxlength="1" autocomplete="off">
        <br><br>

        <label for="tipoTreino">Tipo de treino (F-Físico, T-Técnico, E-Estratégico):</label>
        <input type="text" id="tipoTreino" maxlength="1" autocomplete="off">
        <br><br>

        <label for="duracao">Duração em minutos:</label>
        <input type="number" id="duracao">
        <br><br>

        <label for="intensidade">Intensidade (1 a 10):</label>
        <input type="number" id="intensidade">
        <br><br>

        <button id="calcular">Calcular</button>
        <p id="resultado"></p>

        <button id="gerarRelatorio">Gerar Relatório</button>
        <div id="relatorio"></div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/exercicio5.js"></script>
</body>
</html>
