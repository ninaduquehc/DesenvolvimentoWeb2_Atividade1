<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exercício 1 - Cálculo de Frete</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main>

        <h1>Exercício 1 - Cálculo de Frete</h1>

        <label for="precoCombustivel">
            Preço do litro de combustível:
        </label>

        <input type="number" id="precoCombustivel" step="0.01">

        <br><br>

        <label for="codigoPedido">
            Código do pedido:
        </label>

        <input type="text" id="codigoPedido">

        <br><br>


        <label for="regiao">
            Região:
        </label>

        <label for="regiao">
            Região (1-Sudeste, 2-Sul, 3-Centro-Oeste):
        </label>

        <input type="number" id="regiao">

        <br><br>

        <br><br>


        <label for="distancia">
            Distância em km:
        </label>

        <input type="number" id="distancia">

        <br><br>


        <label for="quantidadePecas">
            Quantidade de peças:
        </label>

        <input type="number" id="quantidadePecas">

        <br><br>

        <label for="rastreamento">
            Deseja rastreamento (R$ 200,00):
        </label>

        <input type="checkbox" id="rastreamento">

        <br><br>


        <button id="calcular">
            Calcular
        </button>

        <p id="resultado"></p>

        <button id="gerarRelatorio">
            Gerar Relatório
        </button>

        <div id="relatorio"></div>

    </main>


    <script src="js/layout.js"></script>
    <script src="js/exercicio1.js"></script>

</body>

</html>
