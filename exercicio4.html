<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 4 - Reservas de Hotel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <h1>Exercício 4 - Reservas de Hotel</h1>

        <label for="valorBase">Valor base da diária padrão:</label>
        <input type="number" id="valorBase" step="0.01">
        <br><br>

        <label for="valorCafe">Valor do café da manhã por hóspede/dia:</label>
        <input type="number" id="valorCafe" step="0.01">
        <br><br>

        <hr>

        <label for="codigoReserva">Código da reserva:</label>
        <input type="text" id="codigoReserva">
        <br><br>

        <label for="tipoQuarto">Tipo de quarto (S-Standard, L-Luxo, P-Premium):</label>
        <input type="text" id="tipoQuarto" maxlength="1">
        <br><br>

        <label for="temporada">Temporada (B-Baixa, A-Alta, F-Feriado):</label>
        <input type="text" id="temporada" maxlength="1">
        <br><br>

        <label for="diarias">Quantidade de diárias:</label>
        <input type="number" id="diarias">
        <br><br>

        <label for="hospedes">Número de hóspedes:</label>
        <input type="number" id="hospedes">
        <br><br>

        <label for="cafeIncluso">Café da manhã incluso (S/N):</label>
        <input type="text" id="cafeIncluso" maxlength="1">
        <br><br>

        <button id="calcular">Calcular</button>
        <p id="resultado"></p>

        <button id="gerarRelatorio">Gerar Relatório</button>
        <div id="relatorio"></div>
    </main>

    <script src="js/layout.js"></script>
    <script src="js/exercicio4.js"></script>
</body>
</html>
